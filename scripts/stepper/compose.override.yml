# ==============================================================================
# FE 관찰용 테스트 서버 — docker-compose.yml 위에 얹는 override. (scripts/stepper/README.md)
#   docker compose -p vigilantis-test -f docker-compose.yml -f scripts/stepper/compose.override.yml ...
# 직접 부르지 말고 scripts/stepper/cli.py로 띄운다 — CLI가 프로젝트명·포트 소유·렌더링 결과를
# 확인하고 토큰(STEPPER_TOKEN)을 넘긴다. 상대 경로는 첫 파일(저장소 루트) 기준으로 해석된다.
#
# 포트는 전부 127.0.0.1에만 연다(`!override` — 기본 파일의 목록을 덧붙이지 않고 통째로 바꾼다).
# 같은 망의 다른 기기가 API·DB·LocalStack에 닿지 못하게 한다. 호스트 포트 번호는 CLI가 고른다 —
# 기본 스택과 같은 번호(5432·4566·8000·FE 3000)부터 보고, 다른 스택·프로그램이 잡고 있으면 +1씩
# 비켜 간 값을 POSTGRES_PORT·LOCALSTACK_PORT·APP_PORT·STEPPER_WEB_PORT로 넘긴다(server.py).
# ==============================================================================

services:
  db:
    ports: !override
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

  localstack:
    ports: !override
      - "127.0.0.1:${LOCALSTACK_PORT:-4566}:4566"

  api:
    # 타이머 없는 진입점 — 제품 앱에 단계 진행 라우터를 붙인다(scripts/stepper/app.py).
    # --reload를 빼 코드 변경이 서버를 재시작해 메모리 상태(버튼 잠금·WS 연결)를 날리지 않게 한다
    command:
      - uv
      - run
      - uvicorn
      - app:build_app
      - --factory
      - --app-dir
      - /app/scripts/stepper
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    # env_file(.env)보다 우선한다. 타이머·inbox 루프를 끄고 AWS를 이 프로젝트의 LocalStack에 고정한다
    environment:
      SCAN_ENABLED: "false"
      DISPATCH_ENABLED: "false"
      MOCK_THREAT_INBOX_DIR: ""
      STEPPER_INBOX_DIR: /app/apps/core-api/.mock-threat-inbox/stepper
      # 파일 로그를 켜면(.env의 LOG_FILE_ENABLED) 같은 체크아웃의 개발 스택과 같은 폴더를 마운트하므로
      # 경로를 갈라 둔다 — 한 파일을 두 스택이 쓰면 줄이 섞이고 회전이 서로를 깨뜨린다
      LOG_FILE_PATH: .logs/stepper/api.log
      STEPPER_TOKEN: ${STEPPER_TOKEN:?scripts/stepper/cli.py로 띄워야 합니다}
      # CLI가 띄우는 FE 주소 — CORS·WebSocket 허용 출처(콤마 구분). FE 포트가 비켜 가면 따라간다.
      # 브라우저를 127.0.0.1로 열어도 막히지 않게 두 이름을 함께 둔다
      CORS_ALLOW_ORIGINS: http://localhost:${STEPPER_WEB_PORT:-3000},http://127.0.0.1:${STEPPER_WEB_PORT:-3000}
      # dispatch 한 번이 판정 대기로 붙잡히는 시간(2×3초) — 시연 실측값(docs/E2E_DEMO_SCENARIOS.md)
      STATUS_CHECK_WAIT_DELAY_SECONDS: "2"
      STATUS_CHECK_WAIT_MAX_ATTEMPTS: "3"
      # 간격이 남아 있으면 다음 dispatch가 판정 불가 실행을 다시 묻지 않는다 — 시간이 흐르지 않는 서버다
      VERIFICATION_RETRY_INTERVAL_SECONDS: "0"
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: ap-northeast-2
      AWS_REGIONS: ""
    ports: !override
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    volumes:
      - ./scripts/stepper:/app/scripts/stepper:ro

  adminer:
    ports: !override
      - "127.0.0.1:${ADMINER_PORT:-8080}:8080"
