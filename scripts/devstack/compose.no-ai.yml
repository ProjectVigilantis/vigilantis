# ==============================================================================
# 개발 스택 — AI 과금 경로를 끈 override. (scripts/devstack/README.md)
#   scripts/devstack/up.ps1 -NoAi 가 docker-compose.yml 위에 얹는다. 직접 쓸 때:
#   docker compose -f docker-compose.yml -f scripts/devstack/compose.no-ai.yml up -d api
#
# environment 는 env_file(.env)보다 우선한다 — 셸 변수($env:SCAN_ENABLED)로는 .env 값을
# 덮을 수 없어 override 파일로 끈다. OpenAI 호출은 AI 분석 대기 스캔(agent_dispatcher)에서만
# 나가며, 그 스캔은 조치 실행 디스패치와 DISPATCH_ENABLED 를 공유한다(main.py 머리 주석).
# ==============================================================================

services:
  api:
    environment:
      # 수집→판정 스캔 — 새 사건(= AI 분석 대기)이 생기지 않게 한다
      SCAN_ENABLED: "false"
      # AI 분석 대기 스캔 + 조치 실행 디스패치·회수 스캔 — 둘 다 멈춘다
      DISPATCH_ENABLED: "false"
