[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vigilantis-schemas"
version = "0.1.0"
description = "Vigilantis Pydantic v2 schemas for Guardrails, Runbooks, Threats, and Assets"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
