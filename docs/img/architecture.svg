  <text x="470" y="200" text-anchor="middle" font-size="12" fill="#43566B">REST · WebSocket</text>
  <text x="430" y="336" text-anchor="middle" font-size="11" fill="#43566B">판정 → Incident</text>
  <text x="633" y="336" text-anchor="middle" font-size="11" fill="#43566B">가드레일 PASS</text>
