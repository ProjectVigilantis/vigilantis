<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 580" width="920" height="580" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
  <rect width="920" height="580" fill="#FFFFFF"/>

  <!-- 관제자 -->
  <rect x="360" y="20" width="200" height="48" rx="6" fill="#1B3A5C"/>
