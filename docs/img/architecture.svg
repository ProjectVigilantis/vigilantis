  <text x="386" y="348" text-anchor="middle" font-size="12" fill="#43566B">rule_engine</text>
  <text x="386" y="368" text-anchor="middle" font-size="12" fill="#43566B">scheduler</text>

  <rect x="477" y="278" width="150" height="128" rx="5" fill="#FFFFFF" stroke="#C48A2E" stroke-width="2"/>
  <text x="552" y="304" text-anchor="middle" font-size="14" font-weight="bold" fill="#8A5E12">ai</text>
