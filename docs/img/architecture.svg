  <text x="709" y="328" text-anchor="middle" font-size="12" fill="#43566B">executor</text>
  <text x="709" y="348" text-anchor="middle" font-size="12" fill="#43566B">backup</text>
  <text x="709" y="368" text-anchor="middle" font-size="12" fill="#43566B">rollback</text>

