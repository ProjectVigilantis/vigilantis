# ==============================================================================
# Alembic config - Core API DB schema migrations. (Issue #60)
# ASCII only: alembic parses this file with the system locale encoding
# (cp949 on Korean Windows), so non-ASCII comments break it. Korean docs
# live in db/migrations/env.py instead.
#
#   apply : uv run alembic -c apps/core-api/alembic.ini upgrade head
#   new   : uv run alembic -c apps/core-api/alembic.ini revision -m "..."
#
# DATABASE_URL is NOT configured here - env.py reads config.get_settings().
# ==============================================================================

[alembic]
script_location = %(here)s/db/migrations
# prefix revision filenames with the creation date for stable ordering
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
