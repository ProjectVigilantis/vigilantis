[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "core-api"
version = "0.1.0"
description = "Vigilantis Core API Service"
requires-python = ">=3.11"
dependencies = [
    "schemas",
]

[tool.uv.sources]
schemas = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["."]
