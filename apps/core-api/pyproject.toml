[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "core-api"
version = "0.1.0"
description = "Vigilantis Core API Service"
requires-python = ">=3.11"
dependencies = [
    "schemas",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic-settings>=2.0",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "apscheduler>=3.10",
    "boto3>=1.34",
    "openai>=1.30",
]

[tool.uv.sources]
schemas = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["."]
