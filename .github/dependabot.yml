# ==============================================================================
# Dependabot — 보안 업데이트 PR만 받는다. 버전 업데이트 PR은 받지 않는다.
# 저장소 설정의 "Dependabot security updates"가 켜져 있어야 이 파일의 묶음이 쓰인다.
#
# open-pull-requests-limit: 0 은 버전 업데이트만 끄고 보안 업데이트는 그대로 둔다(GitHub 문서).
# 경보가 여러 건 떠도 생태계마다 PR 하나로 묶는다. 경보마다 사람이 이슈·lock·PR을 만들던
# 일(#311 · #530)을 리뷰와 머지로 줄이기 위해서다.
# PR 대상은 기본 브랜치(dev)다.
# ==============================================================================
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      web-security:
        applies-to: security-updates
        patterns: ["*"]
    commit-message:
      prefix: "⬆️ [CHORE]"

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      python-security:
        applies-to: security-updates
        patterns: ["*"]
    commit-message:
      prefix: "⬆️ [CHORE]"
