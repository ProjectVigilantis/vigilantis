# ==============================================================================
# Vigilantis CI — push/PR(dev·main) 시 자동 실행
# 현재 범위: LocalStack·PostgreSQL service container + 시드 + uv 의존성 설치 + pytest
# TODO: 린터(ruff 등) 도입 확정 시 lint job 추가
# ==============================================================================
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      localstack:
        image: localstack/localstack:4.14.0
        ports:
          - "4566:4566"
        env:
          SERVICES: ec2,cloudwatch,sts
      # DB 통합 테스트용 — 이미지·계정·DB명을 docker-compose.yml의 db 서비스와 맞춘다(로컬 = CI 동형).
      # conftest의 기본 접속 문자열(vigilantis:vigilantis@localhost:5432)이 그대로 붙으므로
      # 테스트 코드 변경이 필요 없다. 테스트는 실행마다 일회용 DB를 만들고 지운다. (Issue #92)
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vigilantis
          POSTGRES_PASSWORD: vigilantis
          POSTGRES_DB: vigilantis
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U vigilantis"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv (Python 3.11)
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Seed LocalStack
        run: uv run python scripts/seed_localstack.py
        env:
          AWS_ENDPOINT_URL: http://localhost:4566

      # DB 미기동 시 통합 테스트는 조용히 skip되고 CI는 초록불이 된다 —
      # 여기서 먼저 접속을 확인해 그 사각지대를 막는다. (Issue #92)
      - name: Verify PostgreSQL reachable
        run: uv run python -c "import psycopg; psycopg.connect('postgresql://vigilantis:vigilantis@localhost:5432/postgres').close()"

      - name: Run pytest
        run: uv run pytest tests apps/core-api/services/tests apps/core-api/ai/tests packages/schemas/tests apps/core-api/db/tests apps/core-api/tests -q
