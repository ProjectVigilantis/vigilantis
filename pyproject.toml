[project]
name = "vigilantis"
version = "0.1.0"
description = "Vigilantis FinSecOps Platform (MVP)"
readme = "README.md"
authors = [
    { name = "Se Hyeok Kim", email = "kimseh0418@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    # FastAPI TestClient 기반 — 테스트 전용, 런타임 코드는 import하지 않음 (Issue #68)
    "httpx>=0.27",
]

# 루트는 가상(virtual) 워크스페이스 루트입니다. [build-system]을 두지 않아 자체
# 빌드 대상이 아니며, 아래 멤버 패키지들을 묶는 aggregator 역할만 합니다.
[tool.uv.workspace]
members = [
    "apps/core-api",
    "packages/schemas",
    "packages/telemetry",
]

# 테스트 임포트 모드를 importlib로 고정한다 (Issue #193).
# 테스트 디렉터리 7곳 중 __init__.py를 가진 곳이 없어, pytest 기본값 prepend에서는
# 파일 basename이 그대로 최상위 모듈명이 된다. 서로 다른 디렉터리에 같은 이름의
# 테스트 파일이 생기면 모듈명이 충돌하고 에러 1건에 수집 전체가 중단되는데,
# CI는 7개 디렉터리를 한 세션으로 돌리므로 그 즉시 잡 실패가 된다.
# 개별 디렉터리만 돌리면 초록불이라 CI에서야 처음 터진다는 게 이 사고의 핵심이다.
# importlib 모드는 sys.path를 건드리지 않아 이름 충돌 자체가 성립하지 않는다.
# 대신 테스트 파일끼리 `from <형제 모듈> import`는 conftest가 자기 디렉터리를
# sys.path에 넣은 곳에서만 된다 — 지금은 tests/ 하나다(tests/conftest.py).
# 그 처리가 없는 나머지 6곳은 공유 픽스처를 conftest.py로 옮긴다.
[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
